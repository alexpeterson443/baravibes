<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Availability – AddyCleans</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="nav"></div>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900">My Availability</h1>
      <p class="text-gray-500 mt-1">Let Addy know when you're home and available for a cleaning session.</p>
    </div>

    <!-- Week selector -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 mb-6 flex items-center justify-between">
      <button onclick="changeWeek(-1)" class="p-2 rounded-lg hover:bg-gray-100 text-gray-600 text-xl">←</button>
      <div class="text-center">
        <div id="week-label" class="font-semibold text-gray-900"></div>
        <div id="week-range" class="text-sm text-gray-500"></div>
      </div>
      <button onclick="changeWeek(1)" class="p-2 rounded-lg hover:bg-gray-100 text-gray-600 text-xl">→</button>
    </div>

    <div id="msg-success" class="hidden bg-green-50 border border-green-100 text-green-700 rounded-lg px-4 py-3 mb-4 text-sm"></div>
    <div id="msg-error" class="hidden bg-red-50 border border-red-100 text-red-700 rounded-lg px-4 py-3 mb-4 text-sm"></div>

    <form id="form" class="space-y-3">
      <div id="days-container"></div>
      <div class="pt-2 flex gap-3">
        <button type="submit" id="btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl shadow-md shadow-green-100">Save Availability</button>
        <a href="/dashboard.html" class="px-6 bg-white border border-gray-200 text-gray-700 font-semibold py-3 rounded-xl hover:bg-gray-50 text-center">Back</a>
      </div>
    </form>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']
    const DOW_MAP = [1,2,3,4,5,6,0] // Mon=1 ... Sun=0
    let weekOffset = 0
    let slots = DAY_NAMES.map(() => ({ available: false, start_time: '09:00', end_time: '17:00', conflict_notes: '' }))

    function getMonday(off=0) {
      const d = new Date()
      const day = d.getDay()
      d.setDate(d.getDate() - (day===0?6:day-1) + off*7)
      d.setHours(0,0,0,0)
      return d
    }
    function toYMD(d) { return d.toISOString().split('T')[0] }

    function getWeekStart() { return toYMD(getMonday(weekOffset)) }

    function updateWeekLabel() {
      const mon = getMonday(weekOffset)
      const sun = new Date(mon); sun.setDate(sun.getDate()+6)
      document.getElementById('week-label').textContent = weekOffset===0?'This week':weekOffset===1?'Next week':`In ${weekOffset} weeks`
      document.getElementById('week-range').textContent = `${mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${sun.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`
    }

    function renderDays() {
      document.getElementById('days-container').innerHTML = DAY_NAMES.map((day,i) => `
        <div class="bg-white rounded-2xl border ${slots[i].available?'border-green-200':'border-gray-100'} shadow-sm overflow-hidden">
          <div class="p-4 flex items-center gap-4">
            <label class="flex items-center gap-3 cursor-pointer flex-1">
              <div onclick="toggleDay(${i})" class="w-5 h-5 rounded border-2 flex items-center justify-center cursor-pointer ${slots[i].available?'bg-green-600 border-green-600':'border-gray-300'}">
                ${slots[i].available?'<svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>':''}
              </div>
              <span class="font-semibold text-base ${slots[i].available?'text-gray-900':'text-gray-400'}">${day}</span>
            </label>
            ${slots[i].available?`
              <div class="flex items-center gap-2 text-sm">
                <input type="time" value="${slots[i].start_time}" onchange="slots[${i}].start_time=this.value" class="border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-green-500"/>
                <span class="text-gray-400">to</span>
                <input type="time" value="${slots[i].end_time}" onchange="slots[${i}].end_time=this.value" class="border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-green-500"/>
              </div>`:''
            }
          </div>
          ${slots[i].available?`
            <div class="px-4 pb-4">
              <input type="text" value="${slots[i].conflict_notes}" onchange="slots[${i}].conflict_notes=this.value"
                placeholder='Any conflicts? e.g. "Only until 2pm, I have a pickup"'
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500"/>
            </div>`:''}
        </div>`).join('')
    }

    function toggleDay(i) {
      slots[i].available = !slots[i].available
      renderDays()
    }

    async function loadWeek() {
      const r = await fetch(`/api/availability?weekStart=${getWeekStart()}`)
      const data = await r.json()
      slots = DAY_NAMES.map(() => ({ available: false, start_time: '09:00', end_time: '17:00', conflict_notes: '' }))
      for (const s of data.slots || []) {
        const idx = DOW_MAP.indexOf(s.day_of_week)
        if (idx >= 0) slots[idx] = { available: true, start_time: s.start_time, end_time: s.end_time, conflict_notes: s.conflict_notes || '' }
      }
      renderDays()
    }

    function changeWeek(dir) {
      weekOffset += dir
      updateWeekLabel()
      loadWeek()
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btn')
      btn.textContent = 'Saving…'; btn.disabled = true
      document.getElementById('msg-error').classList.add('hidden')
      document.getElementById('msg-success').classList.add('hidden')

      const activeSlots = slots.map((s,i) => ({...s, day_of_week: DOW_MAP[i]})).filter(s=>s.available)
      const res = await fetch('/api/availability', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ weekStart: getWeekStart(), slots: activeSlots })
      })
      const data = await res.json()

      if (!res.ok) {
        document.getElementById('msg-error').textContent = data.error
        document.getElementById('msg-error').classList.remove('hidden')
      } else {
        const mon = getMonday(weekOffset)
        const sun = new Date(mon); sun.setDate(sun.getDate()+6)
        document.getElementById('msg-success').textContent = `✅ Availability saved for ${mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${sun.toLocaleDateString('en-US',{month:'short',day:'numeric'})}!`
        document.getElementById('msg-success').classList.remove('hidden')
        setTimeout(() => document.getElementById('msg-success').classList.add('hidden'), 4000)
      }
      btn.textContent = 'Save Availability'; btn.disabled = false
    })

    async function init() {
      const user = await requireAuth('client')
      if (!user) return
      renderNav(user)
      updateWeekLabel()
      await loadWeek()
    }
    init()
  </script>
</body>
</html>
