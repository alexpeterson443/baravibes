<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – AddyCleans</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 via-white to-emerald-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 mb-6">
        <span class="text-3xl">🧹</span>
        <span class="font-bold text-gray-900 text-2xl">Addy<span class="text-green-600">Cleans</span></span>
      </a>
      <h1 class="text-2xl font-bold text-gray-900">Create your account</h1>
      <p class="text-gray-500 mt-1">Start booking cleanings today</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
      <div id="error" class="hidden bg-red-50 border border-red-100 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm"></div>

      <form id="form" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Full name</label>
          <input type="text" id="name" required placeholder="Jane Smith"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" id="email" required placeholder="you@example.com"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>
        <button type="submit" id="btn"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition-colors shadow-md shadow-green-100">
          Create account
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Already have an account? <a href="/login.html" class="text-green-600 hover:text-green-700 font-medium">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btn')
      const err = document.getElementById('error')
      btn.textContent = 'Creating account…'
      btn.disabled = true
      err.classList.add('hidden')

      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      })
      const data = await res.json()

      if (!res.ok) {
        err.textContent = data.error
        err.classList.remove('hidden')
        btn.textContent = 'Create account'
        btn.disabled = false
        return
      }
      location.href = data.role === 'admin' ? '/admin.html' : '/dashboard.html'
    })
  </script>
</body>
</html>
