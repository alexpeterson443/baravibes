<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request a Booking – AddyCleans</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="nav"></div>

  <main class="max-w-2xl mx-auto px-4 py-8">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Request a Booking</h1>
      <p class="text-gray-500 mt-1">Pick a date and time for your cleaning session.</p>
    </div>

    <div id="success" class="hidden text-center py-16">
      <div class="text-6xl mb-4">🎉</div>
      <h2 class="text-2xl font-bold text-gray-900 mb-3">Request Sent!</h2>
      <p class="text-gray-500 mb-2" id="success-msg"></p>
      <p class="text-gray-400 text-sm mb-8">Addy will review and confirm your request shortly.</p>
      <div class="flex gap-3 justify-center">
        <button onclick="resetForm()" class="bg-white border border-gray-200 text-gray-700 px-6 py-2.5 rounded-lg font-medium hover:bg-gray-50">Book another</button>
        <a href="/dashboard.html" class="bg-green-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-green-700">Back to dashboard</a>
      </div>
    </div>

    <div id="form-container">
      <div id="msg-error" class="hidden bg-red-50 border border-red-100 text-red-700 rounded-lg px-4 py-3 mb-4 text-sm"></div>

      <!-- Step 1: Date -->
      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mb-4">
        <label class="block text-base font-semibold text-gray-900 mb-3">1. Choose a date</label>
        <input type="date" id="date-input" class="border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 w-full sm:w-auto" />
        <div id="no-avail" class="hidden mt-3 text-sm text-amber-600 bg-amber-50 border border-amber-100 rounded-lg px-3 py-2">⚠️ Addy is not available on that day. Please pick a different date.</div>
      </div>

      <!-- Step 2: Time -->
      <div id="step-time" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mb-4">
        <label class="block text-base font-semibold text-gray-900 mb-1">2. Choose a time slot</label>
        <p id="avail-range" class="text-sm text-gray-500 mb-4"></p>
        <div id="slots-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-2"></div>
      </div>

      <!-- Step 3: Message -->
      <div id="step-message" class="hidden bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mb-4">
        <label class="block text-base font-semibold text-gray-900 mb-1">3. Add a note <span class="text-gray-400 font-normal text-sm">(optional)</span></label>
        <p class="text-sm text-gray-500 mb-3">Any special instructions for Addy?</p>
        <textarea id="message" rows="3" placeholder='e.g. "Focus on the kitchen and bathrooms please!"'
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-500 resize-none"></textarea>

        <div id="summary" class="mt-4 bg-green-50 border border-green-100 rounded-xl p-4 flex items-start gap-3">
          <span class="text-2xl">📋</span>
          <div>
            <div class="font-semibold text-gray-900 text-sm">Booking Summary</div>
            <div id="summary-date" class="text-sm text-gray-600 mt-1"></div>
            <div id="summary-time" class="text-sm text-gray-600"></div>
          </div>
        </div>

        <div class="flex gap-3 mt-4">
          <button onclick="submitBooking()" id="submit-btn"
            class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl shadow-md shadow-green-100">
            Send Booking Request
          </button>
          <a href="/dashboard.html" class="px-6 bg-white border border-gray-200 text-gray-700 font-semibold py-3 rounded-xl hover:bg-gray-50 text-center">Cancel</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    let adminAvailability = [], acceptedBookings = [], selectedSlot = null

    function generateSlots(start, end) {
      const slots = []
      let [h,m] = start.split(':').map(Number)
      const [eh,em] = end.split(':').map(Number)
      while (h < eh || (h===eh && m<em)) {
        const s = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`
        let nh=h, nm=m+60
        if (nm>=60){nh++;nm-=60}
        const e = `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`
        if (nh<eh||(nh===eh&&nm<=em)) slots.push({start:s,end:e})
        h=nh; m=nm
      }
      return slots
    }

    document.getElementById('date-input').addEventListener('change', function() {
      const val = this.value
      if (!val) return
      const dow = new Date(val+'T00:00:00').getDay()
      const adminSlot = adminAvailability.find(s => s.day_of_week===dow)
      document.getElementById('no-avail').classList.toggle('hidden', !!adminSlot)
      document.getElementById('step-time').classList.toggle('hidden', !adminSlot)
      document.getElementById('step-message').classList.add('hidden')
      selectedSlot = null

      if (!adminSlot) return

      document.getElementById('avail-range').textContent = `Addy is available ${fmt(adminSlot.start_time)} – ${fmt(adminSlot.end_time)}`
      const bookedTimes = acceptedBookings.filter(b=>b.requested_date===val).map(b=>b.start_time)
      const allSlots = generateSlots(adminSlot.start_time, adminSlot.end_time)

      document.getElementById('slots-grid').innerHTML = allSlots.map(slot => {
        const taken = bookedTimes.includes(slot.start)
        return `<button type="button" onclick="selectSlot('${slot.start}','${slot.end}')"
          ${taken?'disabled':''}
          class="py-2.5 px-3 rounded-xl text-sm font-medium border transition-all slot-btn ${taken?'bg-gray-100 text-gray-300 border-gray-100 cursor-not-allowed line-through':'bg-white text-gray-700 border-gray-200 hover:border-green-400 hover:bg-green-50'}"
          data-start="${slot.start}">
          ${fmt(slot.start)}${taken?'<div class="text-xs text-gray-400">Taken</div>':''}
        </button>`
      }).join('')
    })

    function selectSlot(start, end) {
      selectedSlot = {start,end}
      document.querySelectorAll('.slot-btn').forEach(b => {
        if (b.dataset.start===start) b.className = b.className.replace('bg-white text-gray-700 border-gray-200 hover:border-green-400 hover:bg-green-50','bg-green-600 text-white border-green-600 shadow-md shadow-green-100')
        else if (!b.disabled) b.className = b.className.replace('bg-green-600 text-white border-green-600 shadow-md shadow-green-100','bg-white text-gray-700 border-gray-200 hover:border-green-400 hover:bg-green-50')
      })
      const dateVal = document.getElementById('date-input').value
      document.getElementById('summary-date').textContent = new Date(dateVal+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})
      document.getElementById('summary-time').textContent = `${fmt(start)} – ${fmt(end)}`
      document.getElementById('step-message').classList.remove('hidden')
    }

    async function submitBooking() {
      if (!selectedSlot) return
      const btn = document.getElementById('submit-btn')
      btn.textContent = 'Sending request…'; btn.disabled = true

      const res = await fetch('/api/bookings', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          date: document.getElementById('date-input').value,
          startTime: selectedSlot.start,
          endTime: selectedSlot.end,
          message: document.getElementById('message').value
        })
      })
      const data = await res.json()

      if (!res.ok) {
        document.getElementById('msg-error').textContent = data.error
        document.getElementById('msg-error').classList.remove('hidden')
        btn.textContent = 'Send Booking Request'; btn.disabled = false
        return
      }

      const dateVal = document.getElementById('date-input').value
      document.getElementById('success-msg').textContent = `Your booking request for ${new Date(dateVal+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} at ${fmt(selectedSlot.start)} has been submitted.`
      document.getElementById('form-container').classList.add('hidden')
      document.getElementById('success').classList.remove('hidden')
    }

    function resetForm() {
      selectedSlot = null
      document.getElementById('date-input').value = ''
      document.getElementById('message').value = ''
      document.getElementById('step-time').classList.add('hidden')
      document.getElementById('step-message').classList.add('hidden')
      document.getElementById('success').classList.add('hidden')
      document.getElementById('form-container').classList.remove('hidden')
    }

    async function init() {
      const user = await requireAuth('client')
      if (!user) return
      renderNav(user)

      const today = new Date().toISOString().split('T')[0]
      const maxDate = new Date(); maxDate.setDate(maxDate.getDate()+60)
      document.getElementById('date-input').min = today
      document.getElementById('date-input').max = maxDate.toISOString().split('T')[0]

      const data = await fetch('/api/availability').then(r=>r.json())
      adminAvailability = data.adminAvailability || []
      acceptedBookings = data.acceptedBookings || []
    }
    init()
  </script>
</body>
</html>
